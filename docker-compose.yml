services:
  postgres:
    image: postgres:16
    container_name: gdmr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gdmr_db
      POSTGRES_USER: gdmr_user
      POSTGRES_PASSWORD: gdmr_pass
    ports:
      - "5434:5432"
    volumes:
      - gdmr_pg_data:/var/lib/postgresql/data

volumes:
  gdmr_pg_data: